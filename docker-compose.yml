services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contract_manager
      POSTGRES_PASSWORD: contract_manager
      POSTGRES_DB: contract_manager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,.ngrok.io,.ngrok-free.app,.ngrok.app
      DATABASE_URL: postgres://contract_manager:contract_manager@db:5432/contract_manager
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./uploads:/app/media/uploads
    ports:
      - "4001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py makemigrations --noinput &&
             python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --reload"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgres://contract_manager:contract_manager@db:5432/contract_manager
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./uploads:/app/media/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l INFO

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgres://contract_manager:contract_manager@db:5432/contract_manager
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l INFO

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:4001/graphql
      VITE_API_URL_RELATIVE: /graphql
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4000:3000"
    depends_on:
      - backend

  # Reverse proxy for ngrok access
  # Usage: ngrok http 4002
  # Attrappe fuer einen OIDC-Anbieter, damit sich der SSO-Weg ohne echtes
  # Entra-Verzeichnis durchklicken laesst. Kein Bestandteil der Produktion.
  # Aktivieren: docker compose --profile sso up -d mock-oidc
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    profiles: ["sso"]
    ports:
      - "4003:8080"
    environment:
      # Ohne Anmeldemaske: /authorize leitet sofort zurueck, damit der Test
      # deterministisch bleibt. Die Claims bilden ein Entra-Token nach.
      JSON_CONFIG: >-
        {
          "interactiveLogin": false,
          "tokenCallbacks": [
            {
              "issuerId": "vsx",
              "tokenExpiry": 3600,
              "requestMappings": [
                {
                  "requestParam": "grant_type",
                  "match": "authorization_code",
                  "claims": {
                    "sub": "mock-subject",
                    "tid": "11111111-1111-1111-1111-111111111111",
                    "oid": "aaaaaaaa-0000-0000-0000-000000000001",
                    "email": "admin@test.local",
                    "preferred_username": "admin@test.local",
                    "amr": ["pwd", "mfa"]
                  }
                }
              ]
            }
          ]
        }

  nginx:
    image: nginx:alpine
    ports:
      - "4002:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
