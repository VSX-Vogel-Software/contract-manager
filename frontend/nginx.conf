server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression - Stufe 6 statt Standard 1: das JS-Bundle wird gut
    # 13 % kleiner, die CPU-Kosten sind bei statischen Dateien vernachlaessigbar
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    # auch hinter dem Reverse-Proxy komprimieren (Anfragen mit Via-Header)
    gzip_proxied any;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml;

    # Security headers. Achtung: Ein add_header in einem location-Block
    # ersetzt ALLE add_header des server-Blocks - deshalb dort wiederholt.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Health check endpoint
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Static assets with long cache (Dateinamen enthalten den Inhalts-Hash).
    # Fehlende Chunks (alter Hash nach Deploy) liefern 404 statt index.html -
    # die App erkennt den Ladefehler und laedt neu.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri =404;
    }

    # Logo und Favicon: ohne Hash im Namen, aendern sich aber praktisch nie
    location ~* ^/(vsx-logo\.png|favicon\.svg)$ {
        expires 7d;
        try_files $uri =404;
    }

    # JSON data files — no caching (changelogs, licenses)
    location ~* ^/.*\.json$ {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri =404;
    }

    # SPA fallback - serve index.html for all routes (never cache)
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri $uri/ /index.html;
    }
}
