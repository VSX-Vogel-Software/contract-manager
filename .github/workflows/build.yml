name: Build and Push Docker Images

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_test: ${{ steps.check.outputs.should_test }}
      is_release: ${{ steps.check.outputs.is_release }}
      tag: ${{ steps.check.outputs.tag }}
      minor_tag: ${{ steps.check.outputs.minor_tag }}
      image_prefix: ${{ steps.check.outputs.image_prefix }}
    steps:
      - name: Determine run mode
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Docker verlangt kleingeschriebene Repository-Namen; github.repository
          # traegt die Schreibweise des Owners (z.B. VSX-Vogel-Software).
          echo "image_prefix=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "should_test=true" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "minor_tag=$(echo "$GITHUB_REF_NAME" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          else
            # Branch push: skip entirely if this commit also has a version tag
            TAG=$(gh api "repos/${GITHUB_REPOSITORY}/tags" --per-page=5 \
              --jq ".[] | select(.commit.sha == \"${GITHUB_SHA}\") | .name" | head -1)
            if [[ -n "$TAG" ]]; then
              echo "::notice::Commit ${GITHUB_SHA::7} is tagged $TAG — skipping branch run"
              echo "should_test=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_test=true" >> "$GITHUB_OUTPUT"
            fi
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  test-backend:
    needs: [preflight]
    if: needs.preflight.outputs.should_test == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Install dependencies
        working-directory: ./backend
        # Lock-Datei statt freier Aufloesung: gleiche Versionen wie im Image
        run: |
          uv pip install --system -r requirements-dev.lock
          uv pip install --system --no-deps -e ".[dev]"

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: localhost
        run: pytest --tb=short

  test-frontend:
    needs: [preflight]
    if: needs.preflight.outputs.should_test == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      # vitest ohne "run" bleibt im Watch-Modus haengen und der Job laeuft ins
      # Timeout. Der Job hiess bis 23.09.2026 test-frontend, ohne je einen Test
      # auszufuehren - 22 Dateien mit 181 Tests, von denen drei rot waren, ohne
      # dass es jemand sah.
      - name: Run tests
        working-directory: ./frontend
        run: npx vitest run

      - name: Build
        working-directory: ./frontend
        run: npm run build

  build-backend:
    needs: [preflight, test-backend, test-frontend]
    if: needs.preflight.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.preflight.outputs.image_prefix }}/backend:${{ needs.preflight.outputs.tag }}
            ${{ env.REGISTRY }}/${{ needs.preflight.outputs.image_prefix }}/backend:${{ needs.preflight.outputs.minor_tag }}
            ${{ env.REGISTRY }}/${{ needs.preflight.outputs.image_prefix }}/backend:${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ needs.preflight.outputs.tag }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    needs: [preflight, test-backend, test-frontend]
    if: needs.preflight.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.preflight.outputs.image_prefix }}/frontend:${{ needs.preflight.outputs.tag }}
            ${{ env.REGISTRY }}/${{ needs.preflight.outputs.image_prefix }}/frontend:${{ needs.preflight.outputs.minor_tag }}
            ${{ env.REGISTRY }}/${{ needs.preflight.outputs.image_prefix }}/frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=/graphql
            BUILD_VERSION=${{ needs.preflight.outputs.tag }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
